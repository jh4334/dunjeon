<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>던전 (DunJeon)</title>
<!-- PWA: 상대 경로라 GitHub Pages 하위 경로(/dunjeon/)에서도 그대로 동작한다 -->
<meta name="theme-color" content="#1d4a44">
<meta name="description" content="파티 4인으로 광산 깊이 내려가는 로그라이트 던전 크롤러">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="던전">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="docs/icon-192.png">
<link rel="apple-touch-icon" href="docs/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div id="topLeft">
    <div class="panel" id="lvPanel">Lv. <span id="lvVal">1</span></div>
    <div class="panel" id="goldPanel"><span class="coin"></span><span id="goldVal">0</span></div>
    <div class="panel" id="azPanel"><span class="azIcon"></span><span id="azVal">0</span></div>
  </div>
  <div id="buffBar"></div>

  <div class="panel" id="explorePanel">
    <div class="row"><span id="exploreTitle">초원 탐험</span><span id="explorePct">0%</span></div>
    <div id="exploreBiome" class="hidden"></div>
    <div id="exploreBarWrap"><div id="exploreBar"></div></div>
    <div id="exploreCount">0 / 0</div>
  </div>

  <!-- 보스전 상단 고정 HP 바 (히드라는 머리 3개 분할) -->
  <div id="bossBar" class="hidden">
    <div id="bossBarTop">
      <span id="bossBarName"></span>
      <span id="bossBarTag" class="hidden"></span>
      <span id="bossBarHp"></span>
    </div>
    <div id="bossBarSegs"></div>
    <div id="bossBarGimmick"></div>
  </div>

  <div id="dungeonBanner" class="hidden"><span class="gem">◆</span>&nbsp;광산 입장 · Lv.<span id="recLv">3</span></div>
  <button id="escapeBtn" class="hidden"><span class="gem">◆</span>&nbsp;광산 탈출</button>

  <div id="leftButtons">
    <button class="deco" data-act="party">👤<span id="partyBadge" class="badge hidden">0</span></button>
    <button class="deco" data-act="quest">❗</button>
    <button class="deco" data-act="map">🗺️</button>
    <button class="deco" data-act="settings">⚙️</button>
  </div>

  <div id="dpad">
    <button class="diag" data-dirs="up,left">↖</button><button data-dir="up">↑</button><button class="diag" data-dirs="up,right">↗</button>
    <button data-dir="left">←</button><span class="dpad-center">·</span><button data-dir="right">→</button>
    <button class="diag" data-dirs="down,left">↙</button><button data-dir="down">↓</button><button class="diag" data-dirs="down,right">↘</button>
  </div>

  <!-- 어둠 게이지 (광산 층에서만) -->
  <div id="darkPanel" class="hidden">
    <div class="dRow"><span class="dEye">👁</span><span id="darkVal">0</span><span class="dMax" id="darkMax">/10</span></div>
    <div id="darkBarWrap"><div id="darkBar"></div></div>
  </div>

  <button id="autoBtn">⟳<span>자동</span></button>
  <button id="upgradeBtn">⚒️<span>강화</span></button>
  <button id="flareBtn" class="hidden">🔥<span id="flareVal">0</span></button>

  <div id="vignette" class="hidden"></div>
  <!-- M7c 환영 안개 (보라 오버레이 + 보상 게이지) -->
  <div id="delFog" class="hidden"></div>
  <div id="deliriumPanel" class="hidden">
    <div class="dlRow"><span>🪞 환영</span><span class="dlTier" id="delTier">0/5</span><span id="delKills">0</span></div>
    <div id="delGaugeWrap"><div id="delGauge"></div></div>
  </div>

  <div id="modalWrap" class="hidden">
    <div id="modal">
      <h2 id="modalTitle"></h2>
      <div id="modalBody"></div>
    </div>
  </div>

  <canvas id="minimap" class="hidden" width="180" height="180"></canvas>
  <div id="toast" class="hidden"></div>
  <div id="fade"></div>
</div>

<!-- ===================================================================
     스크립트 로드 순서 (ES 모듈 아님 — file:// 로 직접 열어도 돌아가야 하고
     빌드 단계도 없으므로, 일반 <script> 를 의존 순서대로 나열해 전역을 공유한다)

       1. roster.js   캐릭터 22종 정의 (역할 태그 · 스탯 · 고유 능력 · 외형)
       2. tree.js     PoE식 패시브 트리 290노드 (클러스터 그래프 · 키스톤 15 · 룬 소켓 4)
       3. gems.js     M7b 젬 표 54종 (스킬 21 · 서포트 12 · 각성 21) · 태그/콤보 규칙
       4. core.js     상수 · 유틸 · state/party · 편성/젬/트리 · 스탯 · 세이브
       5. dialogue.js 상황별 캐릭터 대사 테이블 · 성격군 공용 풀 · 대사 엔진
       6. items.js    장비(슬롯/레어리티/접사/고유) · 인벤토리 · 드랍 · 스탯 합산
       7. audio.js    WebAudio SFX 신스
       8. mapgen.js   바이옴 · 레이아웃 알고리즘 · 층 생성/배치
       9. monsters.js 몬스터 · 어픽스 · 팩 · 텔레그래프
      10. combat.js   이동 · 전투 · 캐릭터 능력(미니언/지뢰/오라/실드/변신) · 젬 스킬 엔진
      11. delve.js    광맥 채굴 · 어둠 게이지 · 플레어
      12. meta.js     주간 모드(ISO 주차 시드) · 도전 과제 30종 · 도감
      13. world.js    맵 전환(진입/하강/탈출/정산) · 자동 탐험(풀 루팅)
      14. endgame.js  M7c 환영 모드(안개·보상 게이지·파편) · 우버 보스 2종 · 룬 소켓 재화
      15. ui.js       모달 · HUD · 토스트 · 힌트 · 편성/트리 UI
      16. draw.js     미니맵 · 렌더링
      17. title.js    타이틀 화면 · 첫 런 가이드(코치마크) · service worker 등록
      18. main.js     입력 · 잡담 · 메인 루프 · 부트 · window.GAME

     함수 선언은 파일 안에서만 호이스팅되므로, "로드 시점에 즉시 평가되는"
     참조만 순서를 지키면 된다. 실제로 걸리는 곳은 아래 몇 군데:
       · gems.js 는 순수 데이터/순수 함수뿐이라 core.js 보다 먼저 와야 한다
         (core.js 가 GEMS/GEM_BY_KEY/supportActive 를 쓴다)
       · core.js 가 로드 중 party 를 만들며 ROSTER(roster.js) 사용 → roster.js 가 먼저
       · dialogue.js 가 로드 중 PERSONA_KEYS(roster.js)/DIALOGUE 로 성격군 풀을 만든다
       · items.js 가 로드 중 resetEquipment() 실행, state/party(core.js) 사용 → core.js 가 먼저
       · ui.js 가 로드 중 escapeDungeon(world.js) 을 버튼에 바인딩 → world.js 가 먼저
       · draw.js 가 로드 중 resize() 실행, el()(ui.js) 사용 → ui.js 가 먼저
       · endgame.js 는 world.js 의 transition/showRunSummary, meta.js 의 ensureMeta 를
         런타임에만 쓰므로 world.js 뒤 · ui.js 앞이면 충분하다
     dialogue.js 는 로드 시점에 문자열 테이블만 만들고 state/party/say 는 전부
     런타임에 쓰므로 core.js 뒤 어디에 놓아도 되지만, 다른 모듈이 sayEvent()를
     부르는 것을 눈에 띄게 하려고 core.js 바로 다음에 둔다.
     그 외 상수 테이블/state 는 전부 core.js 에 모여 있어 1번이면 충분하다.
     (core.js 의 maxHp/atkPow 는 items.js 함수를 부르지만 전부 런타임 호출이라
      순서 문제가 없다 — 파티 HP 초기화는 loadSave() 안으로 옮겼다.)
     =================================================================== -->
<script src="js/roster.js"></script>
<script src="js/tree.js"></script>
<script src="js/gems.js"></script>
<script src="js/core.js"></script>
<script src="js/dialogue.js"></script>
<script src="js/items.js"></script>
<script src="js/craft.js"></script>
<script src="js/audio.js"></script>
<script src="js/mapgen.js"></script>
<script src="js/monsters.js"></script>
<script src="js/combat.js"></script>
<script src="js/delve.js"></script>
<script src="js/meta.js"></script>
<script src="js/world.js"></script>
<script src="js/endgame.js"></script>
<script src="js/ui.js"></script>
<script src="js/draw.js"></script>
<script src="js/title.js"></script>
<script src="js/main.js"></script>
</body>
</html>
