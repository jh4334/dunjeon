name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # gh-pages 브랜치로 배포 — 브랜치가 push되면 GitHub가 Pages를 자동 활성화한다
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          # 개발용 파일은 배포에서 뺀다 (게임은 index.html + js/ + style.css 만으로 돈다)
          exclude_assets: '.github,tests,node_modules,package.json,package-lock.json'
